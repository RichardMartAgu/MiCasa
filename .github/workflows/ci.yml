name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Va antes de `npm ci` a propósito: el guard no necesita dependencias
      # (solo node:fs, node:path y node:url), así que un desajuste de la CSP
      # sale en segundos en vez de tras instalar y testear. Y si la variable de
      # repositorio no existe, `${{ vars.* }}` la expande a cadena vacía sin
      # avisar, y el guard se saltaría con un verde: por eso se comprueba antes.
      - name: Comprobar CSP
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Falta la variable de repositorio EXPO_PUBLIC_SUPABASE_URL (Actions > Variables, scope Repository)"
            exit 1
          fi
          node scripts/check-csp.mjs

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
