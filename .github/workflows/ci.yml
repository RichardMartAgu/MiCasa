name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # El guard de la CSP compara lo que dice vercel.json con el origen real de
      # Supabase. Sin esta variable se queda sin contra qué comparar y se salta
      # con un OK que no significa nada, así que aquí se le pasa la de verdad.
      - name: Comprobar CSP
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
        run: npm run check:csp
